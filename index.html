<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="按马林思维原方法制作的古诗带背MVP" />
  <title>背得会｜古诗带背体验</title>
  <style>
    :root{--ink:#20201e;--muted:#77746d;--paper:#f5f1e8;--card:#fffdf8;--green:#26725d;--pale:#e4efe9;--line:#ddd6c8;--orange:#d96f32}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    button,textarea{font:inherit} .shell{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 18px 36px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-weight:800;letter-spacing:.08em}.step{font-size:13px;color:var(--muted)}
    .bar{height:5px;background:#e2ddd2;border-radius:99px;margin-bottom:30px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:12%;transition:.35s}
    .page-nav{margin:-16px 0 20px}.page-nav-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:7px}.page-nav-head b{color:var(--green);font-size:14px}.page-slider-row{display:grid;grid-template-columns:18px 1fr 24px;align-items:center;gap:8px;color:var(--muted);font-size:11px}.page-slider{width:100%;height:20px;margin:0;accent-color:var(--green);cursor:pointer}.page-slider:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:99px}
    h1{font-family:STKaiti,KaiTi,serif;font-size:34px;line-height:1.25;margin:0 0 8px}.sub{color:var(--muted);line-height:1.7;margin:0 0 22px}
    .card{background:var(--card);border:1px solid rgba(48,42,32,.09);border-radius:20px;padding:22px;box-shadow:0 10px 35px rgba(63,54,39,.07)}
    .poem{font-family:STKaiti,KaiTi,serif;text-align:center;font-size:25px;line-height:2.05;letter-spacing:.08em;margin:8px 0 16px}.author{text-align:center;color:var(--muted);font-size:14px}
    .tag{display:inline-flex;background:var(--pale);color:var(--green);font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;margin-bottom:14px}
    .question{font-size:20px;font-weight:800;line-height:1.5;margin:4px 0 12px}.hint{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:14px}
    .original{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;margin:4px 0 18px;text-align:center;font-family:STKaiti,KaiTi,serif;font-size:22px;line-height:1.75;letter-spacing:.06em}.original small{display:block;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11px;line-height:1.2;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
    .choices{display:grid;gap:10px}.choice{border:1px solid var(--line);background:white;border-radius:14px;padding:14px 15px;text-align:left;cursor:pointer;line-height:1.5}.choice:hover{border-color:var(--green)}.choice.selected{border-color:var(--green);background:var(--pale)}
    textarea{width:100%;min-height:105px;border:1px solid var(--line);background:white;border-radius:14px;padding:14px;resize:none;outline:none;line-height:1.7}textarea:focus{border-color:var(--green)}
    .actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:white;flex:1}.ghost{background:#e8e2d7;color:var(--ink)}.primary:disabled{opacity:.4;cursor:not-allowed}
    .feedback{padding:14px;border-radius:14px;background:#fff4e8;border-left:4px solid var(--orange);line-height:1.65;margin-top:14px}.logic{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:20px 0}.logic>div{background:var(--pale);border-radius:14px;padding:15px 8px;text-align:center}.arrow{color:var(--green);font-weight:900}
    .visual{font-size:54px;text-align:center;padding:18px 0}.recall{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px}.blank{border-bottom:2px solid var(--green);text-align:center;padding:8px 2px;font-family:STKaiti,KaiTi,serif;color:var(--green);min-height:42px}
    .scene-list{display:grid;gap:14px;margin:16px 0}.scene-row{display:grid;grid-template-columns:44% 56%;min-height:180px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(63,54,39,.06)}.scene-copy{padding:18px;display:flex;flex-direction:column;justify-content:center}.scene-kicker{font-size:11px;color:var(--green);font-weight:800;margin-bottom:8px}.scene-line{font-family:STKaiti,KaiTi,serif;font-size:20px;line-height:1.65}.scene-note{color:var(--muted);font-size:12px;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.scene-note b{color:var(--green)}.scene-image{min-height:180px;background-image:url('assets/xinglunan-six-scenes.png');background-repeat:no-repeat;background-size:300% 200%;border-left:1px solid var(--line)}.scene-1{background-position:0% 0%}.scene-2{background-position:50% 0%}.scene-3{background-position:100% 0%}.scene-4{background-position:0% 100%}.scene-5{background-position:50% 100%}.scene-6{background-position:100% 100%}@media(max-width:560px){.scene-row{grid-template-columns:43% 57%;min-height:150px}.scene-copy{padding:12px}.scene-line{font-size:16px}.scene-image{min-height:150px}}
    .start-box{margin-top:16px;padding:14px;background:var(--pale);border-radius:14px}.start-box label{display:block;font-size:13px;font-weight:800;color:var(--green);margin-bottom:8px}.start-box input{width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:11px;color:var(--ink);font:inherit}
    .review-list{display:grid;gap:9px;margin:16px 0}.review-task{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;cursor:pointer}.review-task input{width:21px;height:21px;accent-color:var(--green)}.review-task strong{display:block;font-size:14px}.review-task small{color:var(--muted);line-height:1.5}.review-task.done{background:var(--pale);border-color:#b7d4c8}.review-task.done strong:after{content:'  ✓';color:var(--green)}.reminder-box{margin-top:18px;padding:15px;background:#fff4e8;border-radius:14px;text-align:left}.reminder-box textarea{min-height:125px;font-size:12px;background:#fffdf8}.reminder-actions{display:grid;gap:9px;margin-top:10px}.copy-status{font-size:12px;color:var(--green);margin-top:7px;min-height:18px}
    .result{text-align:center}.score{font-size:58px;font-weight:900;color:var(--green);margin:4px}.schedule{margin:20px 0 4px;text-align:left}.schedule div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.dot{width:22px;height:22px;border-radius:50%;background:var(--pale);color:var(--green);text-align:center;font-size:13px;line-height:22px;font-weight:800;flex:none}
    details{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.7}summary{cursor:pointer}.micro{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div class="brand">背得会</div><div class="step" id="stepText">第1页 / 共17页</div></header>
  <nav class="page-nav" aria-label="页面快速跳转"><div class="page-nav-head"><span>拖动跳转页面</span><span>当前第 <b id="sliderValue">1</b> 页</span></div><div class="page-slider-row"><span>1</span><input id="pageSlider" class="page-slider" type="range" min="1" max="17" step="1" value="1" aria-label="选择页码" oninput="jump(Number(this.value)-1)"><span>17</span></div></nav>
  <div class="bar"><i id="bar"></i></div><section id="app"></section>
</main>
<script>
const screens=[
 {render:()=>`<h1>这次背一首<br>真正有转折的诗</h1><p class="sub">不要从头反复读。我们按两句一组，先理解，再把整首诗的情绪和画面串起来。</p><div class="card"><div class="tag">初中篇目 · 约 12 分钟</div><div class="poem" style="font-size:20px;line-height:1.85">金樽清酒斗十千，玉盘珍羞直万钱。<br>停杯投箸不能食，拔剑四顾心茫然。<br>欲渡黄河冰塞川，将登太行雪满山。<br>闲来垂钓碧溪上，忽复乘舟梦日边。<br>行路难！行路难！多歧路，今安在？<br>长风破浪会有时，直挂云帆济沧海。</div><div class="author">李白《行路难·其一》</div><div class="start-box"><label for="startAt">记录本次开始背诵的时间</label><input id="startAt" type="datetime-local" value="${startValue()}"><p class="micro" style="text-align:left;margin-bottom:0">后续第3天、第7天日期将从这个时间自动计算。</p></div></div><div class="actions"><button class="btn primary" onclick="saveStartAndNext()">保存时间，开始带背</button></div>`},
 {render:()=>`<div class="tag">第一组 · 逐句理解</div><div class="original"><small>先看原句</small>金樽清酒斗十千，<br>玉盘珍羞直万钱。</div><div class="question">先把关键词翻译清楚</div><p class="hint">金樽：贵重酒杯。斗十千：一斗酒值十千钱。珍羞：珍贵菜肴，“羞”同“馐”。直万钱：价值万钱，“直”同“值”。</p><div class="logic"><div>名贵美酒</div><span class="arrow">＋</span><div>珍贵菜肴</div></div><div class="feedback">第一幅画面：酒宴非常丰盛。</div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">第一组词义明白了</button></div>`},
 {render:()=>`<div class="tag">第一组 · 自己想画面</div><div class="original"><small>根据刚才理解的意思</small>金樽清酒斗十千，<br>玉盘珍羞直万钱。</div><div class="question">把你脑中出现的画面写下来</div><p class="hint">不用分析作用，也不用写标准答案。写清楚你看见了什么即可。</p><textarea id="answer" data-picture placeholder="例如：桌上摆着……酒杯里……盘子里……" oninput="enablePicture()"></textarea><div id="fb"></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="savePicture()">保存我的画面</button></div>`},
 {render:()=>`<div class="tag">第二组 · 逐句理解</div><div class="original"><small>先看原句</small>停杯投箸不能食，<br>拔剑四顾心茫然。</div><div class="question">把动作顺序拆出来</div><p class="hint">投箸：放下筷子。四顾：环看四周。茫然：心中迷惘，不知怎么办。</p><div class="logic"><div>放杯筷，吃不下</div><span class="arrow">→</span><div>拔剑四顾，心茫然</div></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">第二组词义明白了</button></div>`},
 {render:()=>`<div class="tag">第二组 · 自己想画面</div><div class="original"><small>根据刚才理解的动作</small>停杯投箸不能食，<br>拔剑四顾心茫然。</div><div class="question">把连续发生的动作写成画面</div><p class="hint">顺着原句写：先做了什么，接着做了什么，最后是什么状态。</p><textarea id="answer" data-picture placeholder="我看见他先……接着……最后……" oninput="enablePicture()"></textarea><div id="fb"></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="savePicture()">保存我的画面</button></div>`},
 {render:()=>`<div class="tag">第三组 · 逐句理解</div><div class="original"><small>先看原句</small>欲渡黄河冰塞川，<br>将登太行雪满山。</div><div class="question">把两幅受阻画面拆开</div><p class="hint">欲渡：想渡过。冰塞川：冰堵住河道。将登：想登上。雪满山：大雪封住山路。</p><div class="logic"><div>想过黄河，冰封</div><span class="arrow">＋</span><div>想登太行，雪阻</div></div><div class="feedback">两幅画面都是想向前走，却被挡住。</div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">第三组词义明白了</button></div>`},
 {render:()=>`<div class="tag">第三组 · 自己想画面</div><div class="original"><small>根据刚才理解的两次受阻</small>欲渡黄河冰塞川，<br>将登太行雪满山。</div><div class="question">把河和山两幅画面写下来</div><p class="hint">先写黄河发生了什么，再写太行山发生了什么。</p><textarea id="answer" data-picture placeholder="眼前先是一条……接着又是一座……" oninput="enablePicture()"></textarea><div id="fb"></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="savePicture()">保存我的画面</button></div>`},
 {render:()=>`<div class="tag">第四组 · 典故先理解</div><div class="original"><small>先看原句</small>闲来垂钓碧溪上，<br>忽复乘舟梦日边。</div><div class="question">先把两个典故直接解释清楚</div><p class="hint">“垂钓碧溪”想到姜尚受重用前的等待；“乘舟梦日”想到伊尹受任用前的梦。两幅画都指向等待机会、盼望被重用。</p><div class="logic"><div>等待机会</div><span class="arrow">→</span><div>盼望被重用</div></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">典故意思明白了</button></div>`},
 {render:()=>`<div class="tag">第四组 · 自己想画面</div><div class="original"><small>根据刚才理解的两个典故</small>闲来垂钓碧溪上，<br>忽复乘舟梦日边。</div><div class="question">把垂钓和乘舟两幅画面写下来</div><p class="hint">不用解释典故作用，只写你脑中看到的人、地点和动作。</p><textarea id="answer" data-picture placeholder="先看见有人在……随后画面变成……" oninput="enablePicture()"></textarea><div id="fb"></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="savePicture()">保存我的画面</button></div>`},
 {render:()=>`<div class="tag">第五组 · 转折再起</div><div class="original"><small>先看原句</small>行路难！行路难！<br>多歧路，今安在？</div><div class="question">把反复和问句读懂</div><p class="hint">“行路难”重复两次，强调艰难；“歧路”是岔路；“今安在”是在问：如今正确的路在哪里？</p><div class="logic"><div>反复感叹路难</div><span class="arrow">→</span><div>追问路在哪里</div></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">第五组词义明白了</button></div>`},
 {render:()=>`<div class="tag">第五组 · 自己想画面</div><div class="original"><small>根据刚才理解的感叹与追问</small>行路难！行路难！<br>多歧路，今安在？</div><div class="question">把站在岔路前的画面写下来</div><p class="hint">可以写道路、方向和人物状态，不需要分析诗句作用。</p><textarea id="answer" data-picture placeholder="我看见一个人站在……面前有……" oninput="enablePicture()"></textarea><div id="fb"></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="savePicture()">保存我的画面</button></div>`},
 {render:()=>`<div class="tag">第六组 · 结尾理解</div><div class="original"><small>先看原句</small>长风破浪会有时，<br>直挂云帆济沧海。</div><div class="question">把最后两句拆开理解</div><p class="hint">长风破浪：乘长风、破万里浪。会有时：一定会有实现的一天。直挂云帆：高高挂起船帆。济沧海：渡过大海。</p><div class="logic"><div>相信终会破浪</div><span class="arrow">→</span><div>扬帆渡过沧海</div></div><div class="feedback">记忆顺序：相信时机会来 → 挂起云帆 → 渡过沧海。</div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">结尾理解了</button></div>`},
 {render:()=>`<div class="tag">第六组 · 自己想画面</div><div class="original"><small>根据刚才理解的结尾动作</small>长风破浪会有时，<br>直挂云帆济沧海。</div><div class="question">把最后的航行画面写下来</div><p class="hint">写清楚风、浪、船帆和大海怎样出现在你脑中。</p><textarea id="answer" data-picture placeholder="风吹起来，船……帆……前方是……" oninput="enablePicture()"></textarea><div id="fb"></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="savePicture()">保存我的画面</button></div>`},
 {render:()=>`<div class="tag">整体串联 · 六组变一条线</div><div class="question">现在把整首诗的逻辑从头推一遍</div><div class="schedule"><div><span class="dot">1</span><span><b>盛宴</b>：酒和菜都极其珍贵</span></div><div><span class="dot">2</span><span><b>苦闷</b>：吃不下，拔剑茫然</span></div><div><span class="dot">3</span><span><b>受阻</b>：渡河有冰，登山有雪</span></div><div><span class="dot">4</span><span><b>希望</b>：想起两位等待机会的古人</span></div><div><span class="dot">5</span><span><b>追问</b>：路难、歧路，路在哪里</span></div><div><span class="dot">6</span><span><b>振作</b>：终会破浪，扬帆沧海</span></div></div><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">整条逻辑通了</button></div>`},
 {render:()=>`<div class="tag">整体画面 · 原句逐组对应</div><div class="question">看原句，重新走一遍你写下的画面</div><p class="hint">每一组原句下面，都是你自己刚才生成的画面。按1到6的顺序在脑中连续播放。</p>${pictureReview()}<div class="actions"><button class="btn ghost" onclick="back()">返回</button><button class="btn primary" onclick="next()">六组画面连起来了</button></div>`},
 {render:()=>`<div class="tag">整体检测 · 现在隐藏原文</div><div class="question">只看关键词，把全诗从脑子里推出来</div><p class="hint">先说出每组大意，再尝试还原原句。卡住时，只回看那一组，不要从头重来。</p><div class="recall"><div class="blank">金樽·玉盘</div><div class="blank">停杯·拔剑</div><div class="blank">黄河·太行</div><div class="blank">垂钓·乘舟</div><div class="blank">路难·歧路</div><div class="blank">长风·云帆</div></div><textarea id="answer" placeholder="可以默写全诗，也可以口头背完后填写：完成。" oninput="enableText()"></textarea><div class="actions"><button class="btn ghost" onclick="back()">返回</button><button id="go" class="btn primary" disabled onclick="next()">完成检测</button></div>`},
 {render:()=>`<div class="card result"><div class="tag">本轮完成</div><div class="score">✓</div><div class="question">复习任务表</div><p class="hint">完成一项就勾选一项。状态会保存在这台设备上。</p>${reviewPanel()}${doubaoPanel()}<button class="btn primary" style="width:100%;margin-top:16px" onclick="restart()">再体验一次</button></div><details><summary>查看本体验的方法来源</summary>方法步骤来自 PDF《初高中学习方法》第5、8、11页，以及马林思维视频转录 BV1Wz421q7DY、BV1Gr421M72o、BV1AZ421T7TX。教学内容换为初中篇目《行路难·其一》，未增加新的记忆方法。</details>`}
];
let idx=0, pictureNotes={};
function pad(n){return String(n).padStart(2,'0')}
function localDateTime(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function startValue(){return localStorage.getItem('beidehui_start_at')||localDateTime(new Date())}
function startDate(){const d=new Date(startValue());return isNaN(d)?new Date():d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dateLabel(d,withTime=false){const base=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;return withTime?`${base} ${pad(d.getHours())}:${pad(d.getMinutes())}`:base}
function saveStartAndNext(){const input=document.getElementById('startAt');if(input&&input.value)localStorage.setItem('beidehui_start_at',input.value);next()}
function reviewState(){try{return JSON.parse(localStorage.getItem('beidehui_reviews')||'{}')}catch{return {}}}
function reviewPanel(){const s=startDate(),state=reviewState();const tasks=[['sleep','睡前回顾',`${dateLabel(s)} 睡前，用六个关键词过一遍`],['morning','明早回顾',`${dateLabel(addDays(s,1))} 早晨，不看原文先回忆`],['day3','第3天检测',`${dateLabel(addDays(s,2),true)}，再次完整背诵`],['day7','第7天检测',`${dateLabel(addDays(s,6),true)}，再次完整背诵`]];return `<div class="review-list">${tasks.map(t=>`<label class="review-task ${state[t[0]]?'done':''}" id="task-${t[0]}"><input type="checkbox" ${state[t[0]]?'checked':''} onchange="toggleReview('${t[0]}',this.checked)"><span><strong>${t[1]}</strong><small>${t[2]}</small></span></label>`).join('')}</div>`}
function toggleReview(key,checked){const state=reviewState();state[key]=checked;localStorage.setItem('beidehui_reviews',JSON.stringify(state));document.getElementById(`task-${key}`)?.classList.toggle('done',checked)}
function doubaoText(){const s=startDate();return `请帮我创建两个学习提醒：\n1. ${dateLabel(addDays(s,2),true)}，提醒我完成《行路难·其一》第3天背诵检测。\n2. ${dateLabel(addDays(s,6),true)}，提醒我完成《行路难·其一》第7天背诵检测。\n提醒内容：先不看原文，按“金樽玉盘—停杯拔剑—黄河太行—垂钓乘舟—路难歧路—长风云帆”完整回忆；卡住时只复习对应一组。请真正创建提醒；如果当前无法创建，请明确告诉我。`}
function doubaoPanel(){return `<div class="reminder-box"><b>设置第3天和第7天复习提醒</b><p class="hint" style="margin:6px 0 9px">首选加入手机或电脑日历，不依赖豆包。下载后打开日历文件并确认导入即可。</p><div class="reminder-actions"><button class="btn primary" style="width:100%" onclick="downloadCalendar()">一键添加第3天和第7天提醒</button><button class="btn ghost" style="width:100%" onclick="openDoubao()">用豆包设置提醒</button></div><details style="margin-top:10px"><summary>查看豆包提醒指令</summary><textarea id="doubaoPrompt" readonly>${escapeHtml(doubaoText())}</textarea></details><div class="copy-status" id="copyStatus"></div></div>`}
async function copyDoubao(){const box=document.getElementById('doubaoPrompt');let ok=false;try{await navigator.clipboard.writeText(box.value);ok=true}catch{box.removeAttribute('readonly');box.select();ok=document.execCommand('copy');box.setAttribute('readonly','')}document.getElementById('copyStatus').textContent=ok?'已复制，可以粘贴给豆包':'未能自动复制，请长按上方文字手动复制'}
function icsUtc(date){return date.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function icsEscape(text){return text.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function reminderEvent(date,day){const stamp=icsUtc(new Date());const start=icsUtc(date);const end=icsUtc(new Date(date.getTime()+20*60*1000));const uid=`beidehui-${day}-${date.getTime()}@beidehui-poem-mvp`;return `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTAMP:${stamp}\r\nDTSTART:${start}\r\nDTEND:${end}\r\nSUMMARY:${icsEscape(`《行路难·其一》第${day}天背诵检测`)}\r\nDESCRIPTION:${icsEscape('先不看原文，按“金樽玉盘—停杯拔剑—黄河太行—垂钓乘舟—路难歧路—长风云帆”完整回忆；卡住时只复习对应一组。')}\r\nBEGIN:VALARM\r\nTRIGGER:-PT10M\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEscape(`第${day}天背诵检测即将开始`)}\r\nEND:VALARM\r\nEND:VEVENT`}
function downloadCalendar(){const s=startDate();const content=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Beidehui//Poem Review//ZH-CN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n${reminderEvent(addDays(s,2),3)}\r\n${reminderEvent(addDays(s,6),7)}\r\nEND:VCALENDAR\r\n`;const blob=new Blob(['\ufeff',content],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='背得会-行路难-第3天第7天复习提醒.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('copyStatus').textContent='日历文件已生成。请打开下载的文件，并确认加入日历。'}
async function openDoubao(){const popup=window.open('https://www.doubao.com/chat/','_blank','noopener,noreferrer');let ok=false;try{await navigator.clipboard.writeText(doubaoText());ok=true}catch{}document.getElementById('copyStatus').textContent=ok?'豆包已打开，提醒指令已复制；粘贴并发送后请确认创建结果。':'豆包已打开。浏览器未允许自动复制，请展开上方指令后手动复制。';if(!popup)document.getElementById('copyStatus').textContent='浏览器拦截了新窗口，请允许弹窗后重试。'}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function pictureReview(){const groups=[['金樽清酒斗十千，<br>玉盘珍羞直万钱。',2],['停杯投箸不能食，<br>拔剑四顾心茫然。',4],['欲渡黄河冰塞川，<br>将登太行雪满山。',6],['闲来垂钓碧溪上，<br>忽复乘舟梦日边。',8],['行路难！行路难！<br>多歧路，今安在？',10],['长风破浪会有时，<br>直挂云帆济沧海。',12]];return `<div class="scene-list">${groups.map((g,i)=>`<div class="scene-row"><div class="scene-copy"><div class="scene-kicker">第${i+1}组原句</div><div class="scene-line">${g[0]}</div><div class="scene-note"><b>我的画面：</b>${escapeHtml(pictureNotes[g[1]]||'尚未填写')}</div></div><div class="scene-image scene-${i+1}" role="img" aria-label="第${i+1}组原句对应的具体画面"></div></div>`).join('')}</div>`}
function draw(){document.getElementById('app').innerHTML=screens[idx].render();document.getElementById('stepText').textContent=`第${idx+1}页 / 共${screens.length}页`;document.getElementById('bar').style.width=`${(idx+1)/screens.length*100}%`;document.getElementById('pageSlider').max=screens.length;document.getElementById('pageSlider').value=idx+1;document.getElementById('sliderValue').textContent=idx+1;const box=document.querySelector('textarea[data-picture]');if(box&&pictureNotes[idx]){box.value=pictureNotes[idx];enablePicture()}window.scrollTo({top:0,behavior:'smooth'})}
function jump(page){idx=Math.max(0,Math.min(page,screens.length-1));draw()}
function next(){if(idx<screens.length-1){idx++;draw()}} function back(){if(idx>0){idx--;draw()}} function restart(){idx=0;pictureNotes={};draw()}
function enablePicture(){const box=document.querySelector('textarea[data-picture]');document.getElementById('go').disabled=!box||box.value.trim().length<4}
function savePicture(){const box=document.querySelector('textarea[data-picture]');pictureNotes[idx]=box.value.trim();document.getElementById('fb').innerHTML='<div class="feedback">你的画面已经保存。现在看着原句，把这个画面在脑中完整过一遍。</div>';const go=document.getElementById('go');go.textContent='下一步';go.onclick=next;go.disabled=false}
function enableText(){document.getElementById('go').disabled=document.getElementById('answer').value.trim().length<2}
draw();
</script></body></html>
